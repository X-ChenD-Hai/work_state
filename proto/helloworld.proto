syntax = "proto3";  // 使用proto3语法
package helloworld;  // 包名，用于代码生成


// 请求消息，包含用户名
message HelloRequest {
  string name = 1; // 字段编号必须从1开始
}

// 响应消息，包含问候语
message HelloReply {
  string message = 1;
}

// 服务定义，包含一个RPC方法
service Greeter {
  // SayHello方法，接收HelloRequest，返回HelloReply
  rpc SayHello (HelloRequest) returns (HelloReply);
}

